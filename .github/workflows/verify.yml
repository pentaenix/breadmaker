name: verify-editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-bootstrap-mirror-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install playwright==1.57.0
      - name: Prefer existing HTTPS archive mirror without changing trust or suites
        run: |
          sudo python3 - <<'PYCODE'
          from pathlib import Path
          path=Path('/etc/apt/apt-mirrors.txt')
          original=path.read_text()
          azure='http://azure.archive.ubuntu.com/ubuntu/\tpriority:1'
          archive='https://archive.ubuntu.com/ubuntu/\tpriority:2'
          assert original.splitlines().count(azure)==1 and original.splitlines().count(archive)==1
          updated=original.replace(azure,azure.replace('priority:1','priority:2')).replace(archive,archive.replace('priority:2','priority:1'))
          assert sorted(line.split()[0] for line in original.splitlines())==sorted(line.split()[0] for line in updated.splitlines())
          path.write_text(updated)
          print(updated)
          PYCODE
      - name: Measure unchanged browser and signed OS dependency installation
        run: /usr/bin/time -p python -m playwright install --with-deps chromium firefox webkit
      - name: Verify all three managed browsers launch and close
        run: |
          python -u - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for name in ('chromium','firefox','webkit'):
                  browser=getattr(p,name).launch(headless=True,args=['--no-sandbox'] if name=='chromium' else [])
                  page=browser.new_page()
                  page.set_content('<title>Browser bootstrap check</title><p>Disposable verification</p>')
                  assert page.title()=='Browser bootstrap check'
                  browser.close()
                  print('PASS managed browser',name,flush=True)
          PY
