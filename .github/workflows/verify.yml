name: verify-editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-bootstrap-mirror-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install playwright==1.57.0
      - name: Select canonical Ubuntu archive without changing trust or suites
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          path=Path('/etc/apt/sources.list.d/ubuntu.sources')
          original=path.read_text()
          updated=original
          for scheme in ('http','https'):
              updated=updated.replace(scheme+'://azure.archive.ubuntu.com/ubuntu','https://archive.ubuntu.com/ubuntu')
          assert updated!=original,'Expected GitHub runner Azure Ubuntu mirror not found'
          assert [line for line in original.splitlines() if not line.startswith('URIs:')]==[line for line in updated.splitlines() if not line.startswith('URIs:')]
          assert 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' in updated
          path.write_text(updated)
          print(updated)
          PY
      - name: Measure unchanged browser and signed OS dependency installation
        run: /usr/bin/time -p python -m playwright install --with-deps chromium firefox webkit
      - name: Verify all three managed browsers launch and close
        run: |
          python -u - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for name in ('chromium','firefox','webkit'):
                  browser=getattr(p,name).launch(headless=True,args=['--no-sandbox'] if name=='chromium' else [])
                  page=browser.new_page()
                  page.set_content('<title>Browser bootstrap check</title><p>Disposable verification</p>')
                  assert page.title()=='Browser bootstrap check'
                  browser.close()
                  print('PASS managed browser',name,flush=True)
          PY
