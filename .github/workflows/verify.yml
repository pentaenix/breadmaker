name: verify-editor
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  editor-full-suite:
    name: editor-full-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Audit the full hosted dependency graph (including Google SDKs)
        run: python -m pip_audit --strict --progress-spinner=off --desc=off -r requirements-hosted.txt
      # Cheap regression tripwire before OS/browser setup. This is not a substitute
      # for the complete, exact-commit gate below; every full-suite check remains.
      - name: Check startup contracts and bundled-read safety before browser setup
        run: python -m pytest -q tests/test_v1055.py tests/test_v965.py tests/test_v10560.py
      - name: Install Linux browser dependencies
        run: python -m playwright install-deps chromium
      - name: Install pinned Playwright Chromium
        run: python -m playwright install chromium
      - name: Complete local Editor release gate
        env:
          # Dump stalled Python stacks before the unchanged 15s browser watchdog.
          PYTEST_ADDOPTS: '-o faulthandler_timeout=12'
        run: ./verify-release
      - name: Preserve verification failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-verification-failure
          path: verification-report.txt
          if-no-files-found: ignore
          retention-days: 7
  narration-artifacts:
    name: narration-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Same already-reviewed base as the existing hosted release build.
      PYTHON_BASE_DIGEST: a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
      SCANNER: ghcr.io/aquasecurity/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install and audit the exact public device graph
        working-directory: tools/narration
        run: |
          set -euo pipefail
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level=low
      - name: Build verified public assets and small hosted runtime
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test.txt
          mkdir -p "$RUNNER_TEMP/narration-proof"
          node tools/narration/install.mjs --hosted --output="$RUNNER_TEMP/narration-assets"
          python tools/narration/hosted_manifest.py build --root "$RUNNER_TEMP/narration-assets" --runtime-output "$RUNNER_TEMP/narration-proof/runtime"
          python tools/narration/ci_evidence.py --runtime "$RUNNER_TEMP/narration-proof/runtime" --sha "$GITHUB_SHA" --base "$PYTHON_BASE_DIGEST" --output "$RUNNER_TEMP/narration-proof/evidence.json"
      - name: Build and scan the independent minimal helper
        run: |
          set -euo pipefail
          docker build --build-arg "PYTHON_BASE_DIGEST=$PYTHON_BASE_DIGEST" -f deploy/Dockerfile.pronunciation -t narration-helper:verified .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SCANNER" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress --format json narration-helper:verified > "$RUNNER_TEMP/narration-proof/helper-scan.json"
          python tools/narration/ci_evidence.py --check-scan "$RUNNER_TEMP/narration-proof/helper-scan.json"
      - name: Prove offline native pronunciation paths in the bounded helper
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cpus 1 --memory 1g --memory-swap 1g --tmpfs /tmp:rw,noexec,nosuid,size=32m -v "$GITHUB_WORKSPACE/tools/narration/helper-smoke.py:/tmp/helper-smoke.py:ro" --entrypoint python narration-helper:verified /tmp/helper-smoke.py > "$RUNNER_TEMP/narration-proof/helper-smoke.json"
      - name: Preserve small exact-commit evidence, not models or images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: narration-release-${{ github.sha }}
          path: ${{ runner.temp }}/narration-proof/
          if-no-files-found: error
          retention-days: 7
  notify-cloud-main:
    name: notify-cloud-main
    needs: [editor-full-suite, narration-artifacts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.editor-full-suite.result == 'success' && needs.narration-artifacts.result == 'success' && vars.CLOUD_REPOSITORY != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Ask Cloud to reverify both current protected mains
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          CLOUD_REPO: ${{ vars.CLOUD_REPOSITORY }}
          EDITOR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$CLOUD_REPO"
          gh api -X POST "repos/$CLOUD_REPO/dispatches" \
            -f event_type=editor-main-green -f "client_payload[editor_sha]=$EDITOR_SHA"
