name: verify-editor
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  editor-full-suite:
    name: editor-full-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Chromium and Linux dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Audit the full hosted dependency graph (including Google SDKs)
        run: python -m pip_audit --strict --progress-spinner=off --desc=off -r requirements-hosted.txt
      - name: Complete local Editor release gate
        env:
          # Dump stalled Python stacks before the unchanged 15s browser watchdog.
          PYTEST_ADDOPTS: '-o faulthandler_timeout=12'
        run: ./verify-release
      - name: Preserve verification failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-verification-failure
          path: verification-report.txt
          if-no-files-found: ignore
          retention-days: 7
  notify-cloud-main:
    name: notify-cloud-main
    needs: editor-full-suite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.editor-full-suite.result == 'success' && vars.CLOUD_REPOSITORY != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Ask Cloud to reverify both current protected mains
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DISPATCH_TOKEN }}
          CLOUD_REPO: ${{ vars.CLOUD_REPOSITORY }}
          EDITOR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" && test -n "$CLOUD_REPO"
          gh api -X POST "repos/$CLOUD_REPO/dispatches" \
            -f event_type=editor-main-green -f "client_payload[editor_sha]=$EDITOR_SHA"
